<!DOCTYPE html>
<html>
<head>
<title>Contact Us - Vexora Things</title>

<style>

body{
background:#F8F5F0;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:50px;
border-radius:25px;
width:500px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input,textarea{
width:100%;
padding:15px;
margin-top:15px;
border-radius:15px;
border:1px solid #ddd;
}

textarea{
height:120px;
resize:none;
}

button{
margin-top:25px;
width:100%;
padding:15px;
border:none;
background:#AFCBFF;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>Contact Us</h1>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea placeholder="Your Message"></textarea>

<button>Send Message</button>

</div>

</body>
</html>
