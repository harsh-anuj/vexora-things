<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Vexora Things</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F8F5F0;
color:#333;
}

nav{
background:white;
padding:20px 10%;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:bold;
}

.container{
padding:60px 10%;
}

h1{
margin-bottom:40px;
}

.item{
background:white;
padding:25px;
border-radius:25px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.left{
display:flex;
align-items:center;
gap:20px;
}

.left img{
width:100px;
border-radius:20px;
}

.details h2{
margin-bottom:10px;
}

.buttons button{
background:#AFCBFF;
border:none;
padding:12px 20px;
border-radius:20px;
cursor:pointer;
margin-left:10px;
}

.total-box{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-top:40px;
}

.clear-btn{
margin-top:20px;
background:#ffb3b3;
border:none;
padding:15px 25px;
border-radius:25px;
cursor:pointer;
}

</style>
</head>
<body>

<nav>
<div class="logo">
Vexora Things
</div>
</nav>

<div class="container">

<h1>Your Cart</h1>

<div id="cart-items"></div>

<div class="total-box">

<h2 id="total"></h2>

<button class="clear-btn" onclick="clearCart()">
Clear Cart
</button>

</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let html = "";

cart.forEach(product => {

html += `
<div class="item">

<div class="left">

<img src="https://via.placeholder.com/100">

<div class="details">

<h2>${product.name}</h2>

<p>₹${product.price}</p>

</div>

</div>

<div class="buttons">

<button onclick="removeItem('${product.name}')">
Remove
</button>

</div>

</div>
`;

});

document.getElementById("cart-items").innerHTML = html;

let total = 0;

cart.forEach(product => {

total += product.price;

});

document.getElementById("total").innerHTML =
"Total: ₹" + total;

function removeItem(name){

cart = cart.filter(product => product.name !== name);

localStorage.setItem("cart", JSON.stringify(cart));

location.reload();

}

function clearCart(){

localStorage.removeItem("cart");

location.reload();

}

</script>

</body>
</html>
