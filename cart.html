<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Vexora Things</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F8F5F0;
color:#333;
}

nav{
background:white;
padding:20px 10%;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:bold;
}

.container{
padding:80px 10%;
}

.item{
background:white;
padding:30px;
border-radius:25px;
margin-bottom:30px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

button{
background:#AFCBFF;
border:none;
padding:15px 25px;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<nav>
<div class="logo">
Vexora Things
</div>
</nav>

<div class="container">

<h1>Your Cart</h1>

<div class="item">

<h2>Product 1</h2>

<p>₹999</p>

</div>

<div class="item">

<h2>Total: ₹999</h2>

<button>

Proceed to Checkout

</button>

</div>

</div>

</body>

</html>
