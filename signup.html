<!DOCTYPE html>
<html>
<head>
<title>Sign Up - Vexora Things</title>

<style>

body{
background:#F8F5F0;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:50px;
border-radius:25px;
width:350px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input{
width:100%;
padding:15px;
margin-top:15px;
border-radius:15px;
border:1px solid #ddd;
}

button{
margin-top:25px;
width:100%;
padding:15px;
border:none;
background:#AFCBFF;
border-radius:30px;
font-size:18px;
}

</style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Create Account</button>

</div>

</body>
</html>
