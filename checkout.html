<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Vexora Things</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F8F5F0;
color:#333;
}

nav{
background:white;
padding:20px 10%;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:bold;
}

.container{
padding:80px 10%;
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input{
width:100%;
padding:15px;
margin-top:15px;
border-radius:15px;
border:1px solid #ddd;
}

button{
margin-top:25px;
background:#AFCBFF;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div class="logo">Vexora Things</div>
</nav>

<div class="container">

<div class="card">

<h1>Checkout</h1>

<input type="text" placeholder="Full Name">

<input type="text" placeholder="Address">

<input type="text" placeholder="Phone Number">

<input type="text" placeholder="UPI ID">

<button>
Pay Securely
</button>

</div>

</div>

</body>
</html>
