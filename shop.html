<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Vexora Things</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F8F5F0;
color:#333;
}

nav{
background:white;
padding:20px 10%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:bold;
}

.container{
padding:60px 10%;
}

h1{
text-align:center;
margin-bottom:30px;
}

#search{
width:100%;
padding:15px;
border-radius:30px;
border:1px solid #ddd;
margin-bottom:40px;
font-size:16px;
}

.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.card{
background:white;
padding:25px;
width:300px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-align:center;
}

.card img{
width:100%;
border-radius:20px;
}

.card h2{
margin-top:20px;
}

button{
background:#AFCBFF;
border:none;
padding:12px 20px;
border-radius:20px;
cursor:pointer;
margin-top:15px;
margin-right:10px;
}

</style>
</head>
<body>

<nav>

<div class="logo">
Vexora Things
</div>

</nav>

<div class="container">

<h1>Shop</h1>

<input
id="search"
type="text"
placeholder="Search products..."
onkeyup="displayProducts()"
>

<div class="grid" id="products-container">

</div>

</div>

<script src="products.js"></script>
<script src="script.js"></script>

<script>

function displayProducts(){

let keyword =
document.getElementById("search").value.toLowerCase();

let html = "";

products.forEach(product=>{

if(product.name.toLowerCase().includes(keyword)){

html += `

<div class="card">

<img src="${product.image}">

<h2>${product.name}</h2>

<p>${product.category}</p>

<h3>₹${product.price}</h3>

<button onclick="addToCart('${product.name}',${product.price})">

Add to Cart

</button>

<button onclick="addToWishlist('${product.name}',${product.price})">

❤️

</button>

</div>

`;

}

});

document.getElementById("products-container").innerHTML =
html;

}

displayProducts();

</script>

</body>
</html>
