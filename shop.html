<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Vexora Things</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F8F5F0;
color:#333;
}

nav{
background:white;
padding:20px 10%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:bold;
}

.products{
padding:80px 10%;
}

.products h1{
text-align:center;
font-size:50px;
margin-bottom:50px;
}

.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.card{
background:white;
padding:30px;
border-radius:25px;
width:300px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card img{
width:100%;
border-radius:20px;
}

.card h2{
margin-top:20px;
}

button{
margin-top:15px;
background:#AFCBFF;
border:none;
padding:15px 25px;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<nav>
<div class="logo">Vexora Things</div>
</nav>

<section class="products">

<h1>Shop</h1>

<div class="grid">

<div class="card">
<img src="https://via.placeholder.com/250">
<h2>Product 1</h2>
<p>Premium quality product</p>
<h3>₹999</h3>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250">
<h2>Product 2</h2>
<p>Modern and elegant</p>
<h3>₹1499</h3>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250">
<h2>Product 3</h2>
<p>Best seller collection</p>
<h3>₹1999</h3>
<button>Add to Cart</button>
</div>

</div>

</section>

</body>
</html>
