<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - Vexora Things</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F8F5F0;
color:#333;
}

nav{
background:white;
padding:20px 10%;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:bold;
}

.container{
padding:60px 10%;
}

.item{
background:white;
padding:25px;
border-radius:25px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

button{
background:#ffb6c1;
border:none;
padding:12px 20px;
border-radius:20px;
cursor:pointer;
margin-top:15px;
}

</style>
</head>

<body>

<nav>
<div class="logo">
Vexora Things
</div>
</nav>

<div class="container">

<h1>Your Wishlist ❤️</h1>

<div id="wishlist-items"></div>

</div>

<script>

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

let html = "";

wishlist.forEach(product => {

html += `
<div class="item">

<h2>${product.name}</h2>

<p>₹${product.price}</p>

</div>
`;

});

document.getElementById("wishlist-items").innerHTML = html;

</script>

</body>
</html>
